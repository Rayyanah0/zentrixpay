name: Deploy

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build server and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:registry-client

      - run: pnpm --filter @zentrixpay/server build

      - name: Build web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STELLAR_NETWORK: ${{ vars.VITE_STELLAR_NETWORK || 'testnet' }}
        run: pnpm --filter @zentrixpay/web build

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-dist
          path: |
            server/dist
            server/package.json
            packages/registry-client/dist
          retention-days: 7

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  deploy-server:
    name: Deploy server
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in the ${{ github.event.inputs.environment || 'production' }} environment."
            exit 1
          fi
          pnpm db:migrate

      - name: Trigger server deploy
        env:
          DEPLOY_HOOK: ${{ secrets.SERVER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::SERVER_DEPLOY_HOOK secret is not set in the ${{ github.event.inputs.environment || 'production' }} environment."
            exit 1
          fi
          echo "Triggering server deployment…"
          HTTP_STATUS=$(curl -s -o /tmp/deploy-response.txt -w "%{http_code}" \
            -X POST "$DEPLOY_HOOK")
          cat /tmp/deploy-response.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Server deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Server deploy triggered (HTTP $HTTP_STATUS)."

  deploy-web:
    name: Deploy web
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Trigger web deploy
        env:
          DEPLOY_HOOK: ${{ secrets.WEB_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::WEB_DEPLOY_HOOK secret is not set in the ${{ github.event.inputs.environment || 'production' }} environment."
            exit 1
          fi
          echo "Triggering web deployment…"
          HTTP_STATUS=$(curl -s -o /tmp/deploy-response.txt -w "%{http_code}" \
            -X POST "$DEPLOY_HOOK")
          cat /tmp/deploy-response.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Web deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Web deploy triggered (HTTP $HTTP_STATUS)."

  smoke-test:
    name: Post-deploy smoke check
    needs: [deploy-server, deploy-web]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Wait for services to settle
        run: sleep 30

      - name: Check server liveness
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::SERVER_URL variable is not set in the environment."
            exit 1
          fi
          echo "Smoke testing $SERVER_URL/health"
          for attempt in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              --max-time 15 "$SERVER_URL/health")
            if [ "$HTTP_STATUS" = "200" ]; then
              cat /tmp/health.json
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $HTTP_STATUS — retrying in 15s…"
            sleep 15
          done
          echo "::error::Smoke check failed: $SERVER_URL/health did not return 200"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Check API catalog and payment challenge
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::SERVER_URL variable is not set in the environment."
            exit 1
          fi

          CATALOG_STATUS=$(curl -sS -o /tmp/apis.json -w "%{http_code}" \
            --max-time 15 "$SERVER_URL/apis")
          if [ "$CATALOG_STATUS" != "200" ]; then
            echo "::error::API catalog smoke check failed: HTTP $CATALOG_STATUS"
            cat /tmp/apis.json
            exit 1
          fi

          API_AND_METHOD=$(node -e '
            const payload = JSON.parse(require("node:fs").readFileSync("/tmp/apis.json", "utf8"));
            const apis = Array.isArray(payload) ? payload : payload?.items;
            if (!Array.isArray(apis)) {
              console.error("GET /apis did not return an API list.");
              process.exit(1);
            }
            const api = apis.find((entry) => entry && entry.id &&
              (entry.allowedMethods ?? ["GET"]).some((method) => method.toUpperCase() === "GET"))
              ?? apis.find((entry) => entry && entry.id && entry.allowedMethods?.length);
            if (!api) {
              console.error("No listed API supports a smoke-test request.");
              process.exit(1);
            }
            const method = (api.allowedMethods ?? ["GET"])[0].toUpperCase();
            process.stdout.write(`${api.id}\t${method}`);
          ')
          API_ID=${API_AND_METHOD%%$'\t'*}
          API_METHOD=${API_AND_METHOD#*$'\t'}

          PAYMENT_STATUS=$(curl -sS -D /tmp/proxy-headers.txt -o /tmp/proxy-body.txt \
            -w "%{http_code}" --max-time 15 -X "$API_METHOD" "$SERVER_URL/api/$API_ID")
          if [ "$PAYMENT_STATUS" != "402" ]; then
            echo "::error::Unpaid proxy smoke check expected HTTP 402, got HTTP $PAYMENT_STATUS"
            cat /tmp/proxy-body.txt
            exit 1
          fi

          PAYMENT_REQUIRED=$(awk 'tolower($1) == "payment-required:" { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit }' /tmp/proxy-headers.txt)
          if [ -z "$PAYMENT_REQUIRED" ] || ! node -e '
            try {
              const challenge = JSON.parse(Buffer.from(process.argv[1], "base64").toString("utf8"));
              if (!Number.isInteger(challenge.x402Version) ||
                  !Array.isArray(challenge.accepts) ||
                  !challenge.accepts.some((requirement) =>
                    typeof requirement?.scheme === "string" &&
                    typeof requirement?.network === "string" &&
                    typeof requirement?.asset === "string" &&
                    typeof requirement?.payTo === "string" &&
                    (typeof requirement?.amount === "string" ||
                     typeof requirement?.maxAmountRequired === "string")
                  )) {
                process.exit(1);
              }
            } catch {
              process.exit(1);
            }
          ' "$PAYMENT_REQUIRED"; then
            echo "::error::Unpaid proxy response did not contain a valid PAYMENT-REQUIRED challenge."
            cat /tmp/proxy-headers.txt
            exit 1
          fi
          echo "API catalog and unpaid proxy payment challenge checks passed."

      - name: Check web availability
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          if [ -z "$WEB_URL" ]; then
            echo "WEB_URL not set — skipping web smoke check."
            exit 0
          fi
          echo "Smoke testing $WEB_URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$WEB_URL")
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Web smoke check failed: HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Web smoke check passed (HTTP $HTTP_STATUS)."
